<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speedskating Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Speedskating Manager</h1>
      <p>Leid je team, train slim en win races op het ijs.</p>
    </header>

    <main class="layout">
      <section class="panel manager-panel">
        <h2>Teammanagement</h2>
        <div class="stats">
          <div><strong>Budget:</strong> €<span id="budget">500000</span></div>
          <div><strong>Teamniveau:</strong> <span id="facilityLevel">1</span></div>
          <div><strong>Moreel:</strong> <span id="morale">70</span></div>
          <div><strong>Trainingsfocus:</strong> <span id="focusLabel">Balans</span></div>
        </div>

        <div class="controls">
          <label for="trainingFocus">Kies trainingsfocus</label>
          <select id="trainingFocus">
            <option value="balanced">Balans</option>
            <option value="stamina">Uithoudingsvermogen</option>
            <option value="technique">Techniek</option>
            <option value="sprint">Sprint</option>
          </select>
          <button id="trainButton">Train week (+5k)</button>
          <button id="upgradeButton">Upgrade faciliteiten (+100k)</button>
        </div>

        <h3>Selectie (kies 3 schaatsers)</h3>
        <ul id="roster" class="roster"></ul>
        <button id="startRaceButton" class="primary">Start race</button>
      </section>

      <section class="panel race-panel">
        <h2>3D Race Simulatie</h2>
        <div id="sceneContainer" class="scene"></div>
        <div class="race-info">
          <strong>Status:</strong> <span id="raceStatus">Klaar voor start</span>
        </div>
        <ol id="leaderboard" class="leaderboard"></ol>
      </section>
    </main>

    <script type="module" src="src/game.js"></script>
  </body>
</html>
